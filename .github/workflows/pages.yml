# Publishes the site to GitHub Pages on every push to main. Tests gate the deploy; the layout comes
# from scripts/assemble-site.mjs (the same mapping the dev server uses), which also writes build.json
# so the page footer shows which build is live.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Accessibility gate (IS 5568 / WCAG 2.1 AA). The audit's tools are not site dependencies.
      - run: npm i --no-save playwright@1.64.1 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/a11y-audit.mjs
      - run: node scripts/assemble-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
